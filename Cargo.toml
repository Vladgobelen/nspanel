[package]
name = "nspanel"
version = "0.1.0"
edition = "2024"

[dependencies]
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
chrono = "0.4.45"
fontdue = "0.9.5"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
nix = { version = "0.31.3", features = ["poll", "socket", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
png = "0.18.1"